<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ターミナル基本コマンドリファレンス ─ 使い方・例・意味まとめ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../shared/toast.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-12">
      <header class="mb-12 text-center">
        <h1
          class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-4 tracking-tight"
        >
          ターミナル基本コマンド<br />
          使い方・例・意味まとめ
        </h1>
        <p class="text-gray-600 max-w-2xl mx-auto mb-8">
          プログラミングの学習で避けては通れない「ターミナル（黒い画面）」の基本操作をまとめました。<br class="hidden md:block" />
          ディレクトリの移動やファイルの操作など、よく使うコマンドをマスターしましょう。
        </p>

        <!-- シェル選択タブ -->
        <div class="max-w-md mx-auto mb-10 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <p class="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wider">お使いのOSに合わせて表示を切り替えてください</p>
            <div class="flex justify-center gap-3">
                <button
                    id="tab-bash"
                    class="flex-1 px-4 py-2 rounded-lg font-bold transition-all shadow-sm border border-gray-200 text-sm md:text-base"
                >
                    Mac / Linux
                </button>
                <button
                    id="tab-powershell"
                    class="flex-1 px-4 py-2 rounded-lg font-bold transition-all shadow-sm border border-gray-200 text-sm md:text-base"
                >
                    Windows
                </button>
            </div>
        </div>

        <div class="text-center mb-8">
          <span
            class="text-sm bg-indigo-100 text-indigo-800 px-2 py-1 rounded inline-block"
            >💡 コマンドをクリックするとコピーできます</span
          >
        </div>
      </header>

      <!-- 基本コマンドセクション -->
      <section class="mb-16">
        <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <span class="w-2 h-8 bg-indigo-600 rounded-full"></span>
            基本コマンド
        </h2>
        <div
            id="terminal-container"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
        >
            <!-- JavaScriptで動的に生成されます -->
        </div>
      </section>

      <!-- 便利な機能セクション -->
      <section class="mb-12">
        <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <span class="w-2 h-8 bg-amber-500 rounded-full"></span>
            効率アップ！便利なキー操作
        </h2>
        <div
            id="special-keys-container"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
        >
            <!-- JavaScriptで動的に生成されます -->
        </div>
      </section>

      <footer
        class="mt-16 text-center text-sm text-gray-500 border-t pt-8 pb-4"
      >
        <p>
          ※使用しているシェル（bash / zsh等）やOS（Windows / Mac / Linux）によって、一部の挙動やオプションが異なる場合があります。
        </p>
      </footer>
    </div>

    <div
      id="toast"
      class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded shadow-lg z-50 text-sm font-medium"
    >
      コピーしました！
    </div>

    <script src="../shared/toast.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
